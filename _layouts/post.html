---
layout: default
---
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/littlefoot@4/dist/littlefoot.css">

<article class="prose post"><p class="eyebrow">{% if page.collection == 'articles' %}Mathematics article{% else %}Blog post{% endif %}</p><h1>{{ page.title }}</h1>{% if page.date %}<p class="date">{{ page.date | date: "%d %B %Y" }}</p>{% endif %}{{ content }}</article>

<script src="https://cdn.jsdelivr.net/npm/littlefoot@4/dist/littlefoot.js"></script>
<script>
  littlefoot.littlefoot({
    activateOnHover: true,
    dismissOnUnhover: true,
  });
</script>
