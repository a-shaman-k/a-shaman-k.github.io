title: "Aashman"
description: "Notes on mathematics, learning, and the world."
url: "https://a-shaman-k.github.io"
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
collections:
  articles:
    output: true
    permalink: /writing/articles/:name/
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: articles
    values:
      layout: post
